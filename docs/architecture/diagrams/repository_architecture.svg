    <text x="25" y="112" font-family="monospace" font-size="11" fill="#a7f3d0">├── heuristics/ (Z-score)</text>
    <text x="25" y="134" font-family="monospace" font-size="11" fill="#a7f3d0">├── models/ (scikit-learn)</text>
    <text x="25" y="156" font-family="monospace" font-size="11" fill="#a7f3d0">├── analysis/ (explainability)</text>
    <text x="25" y="178" font-family="monospace" font-size="11" fill="#a7f3d0">└── templates/ (DPDP Sec 12)</text>
    
    <rect x="15" y="245" width="240" height="115" rx="6" fill="#061a15" stroke="#064e3b"/>
    <text x="25" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">RESPONSIBILITIES &amp; TECH:</text>
    <text x="25" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Statistical Outlier Detection</text>
    <text x="25" y="303" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Explainable Risk Heuristics</text>
    <text x="25" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Gemini Flash DPDP Synthesis</text>
    <text x="25" y="339" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Masked Prompt Pipelines</text>
  </g>

  <!-- CARD 4: MEMBER 4 (FRONTEND) -->
  <g transform="translate(890, 220)">
    <rect width="270" height="380" rx="10" fill="url(#cardGradM4)" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="36" rx="10" fill="#d97706" opacity="0.2"/>
    <text x="135" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">MEMBER 4: UI/UX &amp; WORKFLOW</text>
    <text x="135" y="52" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">frontend/ (member-4/frontend)</text>
    
    <line x1="20" y1="65" x2="250" y2="65" stroke="#78350f" stroke-width="1"/>
    
    <text x="25" y="90" font-family="monospace" font-size="11" fill="#fde68a">├── src/components/ (HUD)</text>
    <text x="25" y="112" font-family="monospace" font-size="11" fill="#fde68a">├── src/pages/ (Dashboard)</text>
    <text x="25" y="134" font-family="monospace" font-size="11" fill="#fde68a">├── src/services/ (api.js)</text>
    <text x="25" y="156" font-family="monospace" font-size="11" fill="#fde68a">├── src/hooks/ (threat feed)</text>
    <text x="25" y="178" font-family="monospace" font-size="11" fill="#fde68a">├── public/ (assets, icons)</text>
    <text x="25" y="200" font-family="monospace" font-size="11" fill="#fde68a">└── package.json (React 19)</text>
    
    <rect x="15" y="245" width="240" height="115" rx="6" fill="#1c1206" stroke="#78350f"/>
    <text x="25" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">RESPONSIBILITIES &amp; TECH:</text>
    <text x="25" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• React 19 + Vite + Vanilla CSS</text>
    <text x="25" y="303" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Cyber SOC War-Room Dashboard</text>
    <text x="25" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• SVG Exposome Threat Meter</text>
    <text x="25" y="339" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#cbd5e1">• Interactive Sandbox &amp; Voice HUD</text>
  </g>

  <!-- SHARED INFRASTRUCTURE / PLANNED ROW -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="135" rx="10" fill="url(#sharedGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">SHARED INTEGRATION &amp; INFRASTRUCTURE DIRECTORIES</text>
    
    <!-- Voice -->
    <rect x="20" y="40" width="190" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#f43f5e">voice/ (Planned)</text>
    <text x="30" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• Porcupine Wake-Word</text>
    <text x="30" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• Vosk STT + Pyttsx3 TTS</text>
    
    <!-- Tests -->
    <rect x="225" y="40" width="200" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="235" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">tests/ (Shared)</text>
    <text x="235" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• tests/backend, security</text>
    <text x="235" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• tests/ai, integration</text>

    <!-- Docs -->
    <rect x="440" y="40" width="220" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="450" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">docs/ (Architecture)</text>
    <text x="450" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• ARCHITECTURE.md (Master)</text>
    <text x="450" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• REPOSITORY_STRUCTURE.md</text>

    <!-- Scripts -->
    <rect x="675" y="40" width="180" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="685" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">scripts/ (Utilities)</text>
    <text x="685" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• dev_setup.ps1</text>
    <text x="685" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• seed_demo_data.py</text>

    <!-- Root Config Files -->
    <rect x="870" y="40" width="230" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="880" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">Root Config &amp; Deploy</text>
    <text x="880" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• .env.example (Config contract)</text>
    <text x="880" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">• docker-compose.yml / README</text>
  </g>
</svg>
